# Configuración principal del proyecto oilcast.
# Todos los parámetros del pipeline (datos, ventanas, particiones, HPO, evaluación y modelo
# de producción) se leen de aquí; el código no contiene números mágicos dispersos.

seed: 42

paths:
  results_dir: reports/results
  models_dir: models
  figures_dir: reports/figures

data:
  start_date: "2000-01-01"
  timeout_s: 30
  retries: 3
  # FRED (sin clave): id de la serie -> nombre interno
  fred:
    DCOILBRENTEU: brent        # objetivo
    DCOILWTICO: wti
    DHHNGSP: gas
    ECBDFR: ecb_rate
    DEXUSEU: usd_per_eur
    DEXCHUS: cny_per_usd
    VIXCLS: vix
  # Yahoo Finance: futuros con OHLCV y series de solo cierre
  yahoo_ohlcv:
    "BZ=F": brent_fut
    "CL=F": wti_fut
  yahoo_close:
    "HG=F": copper
    "GC=F": gold
    "DX-Y.NYB": dxy
  # Cesta OPEP (opcional, best-effort). Si la web no responde se continúa sin ella.
  opec_url: https://www.opec.org/basket/basketDayArchives.xml

features:
  window: 60                     # días de entrada a la red (igual para RNN, LSTM y GRU)
  # Variables que pueden faltar al principio de la muestra (valen 0 tras escalar y llevan un
  # canal <nombre>_disp que indica si hay dato). Vacío en la configuración principal.
  optional: []
  clip_quantiles: [0.005, 0.995] # recorte de entradas con umbrales ajustados solo en train
  vol_windows: [21, 63]
  ma_windows: [63, 252]
  momentum_window: 252
  rate_change_window: 21
  volume_window: 63

targets:
  horizons: [5, 63, 252]         # días hábiles del Brent
  quantiles: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95]
  # true = la red aprende desviaciones respecto a la media del entrenamiento y no se le
  # devuelve esa media: no puede proyectar al futuro la tendencia del periodo de entrenamiento.
  remove_drift: true             # adoptado en la ronda 2
  intervals:                     # nivel nominal -> par de cuantiles
    "80": [0.10, 0.90]
    "50": [0.25, 0.75]

# Variables propias de cada plazo (propuesta B, reports/experiments/propuestas.md). A 252
# sesiones las tres redes solo reciben la relación oro/crudo (barriles por onza frente a su
# media de 3 años) y llevan un atajo lineal (ronda 4). A 5 y 63 sesiones usan las 20 variables.
horizon_overrides:
  "252":
    features: {valuation: true, valuation_window: 756, only: [oro_crudo]}
    highway: true

splits:
  test_start: "2022-01-01"
  # Bloques de validación de 2 años para la CV walk-forward (expanding window, purgada)
  cv_blocks:
    - ["2014-01-01", "2016-01-01"]
    - ["2016-01-01", "2018-01-01"]
    - ["2018-01-01", "2020-01-01"]
    - ["2020-01-01", "2022-01-01"]
  # Reentrenos de la evaluación walk-forward. Los anteriores a test_start solo generan
  # predicciones fuera de muestra para calibrar el intervalo (conformal); nunca se reportan.
  # 2008-2012 no se usan nunca para validar ni elegir hiperparámetros (rondas 3 y 4).
  calibration_refits: ["2008-01-01", "2010-01-01", "2012-01-01", "2014-01-01",
                       "2016-01-01", "2018-01-01", "2020-01-01"]
  test_refit_every_years: 1

architectures: [rnn, lstm, gru]

training:
  max_epochs: 150
  patience: 15
  min_epochs: 5
  grad_clip: 1.0
  eval_batch_size: 4096
  num_threads: 2                 # hilos CPU por proceso (se lanzan varios en paralelo)

tuning:
  # Presupuesto común documentado en docs/experimento-ronda2.md.
  n_trials: 80                   # mismo presupuesto para las tres arquitecturas
  startup_trials: 15             # trials aleatorios de TPE antes de modelar
  pruner_startup_trials: 10
  space:
    hidden_size: [16, 32, 64, 128, 256]
    num_layers: [1, 3]
    dropout: [0.0, 0.5]
    lr: [1.0e-4, 3.0e-3]
    weight_decay: [1.0e-6, 1.0e-2]
    batch_size: [64, 128, 256]

evaluation:
  seeds: [0, 1, 2, 3, 4]
  # Residuos fuera de muestra usados por la calibración conformal: null = todos los ya
  # realizados (ventana expansiva). Con h=252 los objetivos se solapan casi por completo, así que
  # una ventana móvil de pocos años equivaldría a muy pocas observaciones independientes.
  conformal_window: null
  conformal_min_scores: 100
  # Recalibración del centro: el valor central se multiplica por un factor en [0, 1] estimado
  # con los errores ya conocidos en cada fecha (0 = ingenuo mientras haya menos de
  # center_min_scores errores conocidos).
  recalibrate_center: true       # adoptado en la ronda 2
  center_min_scores: 100
  dm_loss: squared               # pérdida para Diebold-Mariano (squared | absolute)

final:
  architecture: auto             # auto = la elegida en reports/results/selection.json
  seeds: [0, 1, 2, 3, 4]
  stale_after_days: 30           # la app sugiere reentrenar pasado este plazo

app:
  data_ttl_s: 3600
  history_years_default: 5

# Red de la aplicación: propuesta B, elegida DESPUÉS de ver el test (reports/experiments/propuestas.md).
# ``alternatives`` recoge las variantes que ganan a B en algún plazo del test y por qué no se usan;
# la comparativa y la web las muestran tal cual.
selection:
  arch: rnn
  rule: >-
    La aplicación usa la RNN simple en los tres plazos (propuesta B): 20 variables diarias a
    1 semana y 3 meses, y la relación oro/crudo a 1 año. En el test es la mejor de las tres
    redes a 1 semana y en la media de los tres plazos, la que menos varía entre semillas y la
    que tiene menos parámetros. La combinación se eligió después de ver el test 2022-2026:
    antes de 2022 mejoraba al ingenuo un 3,7 % de media, frente al 5,3 % de la LSTM que había
    elegido la regla de la ronda 4. La ronda 5 probó variantes con una regla fijada antes de
    entrenar y ninguna superó a B en todos los periodos anteriores a 2022.
  alternatives:
    - horizon: 5
      name: "GRU de la primera versión de la app"
      test: "+1,6 % (B +0,6 %)"
      development: "—"
      reason: "Es otra arquitectura y pierde en los otros plazos: −8,0 % a 3 meses y −15,1 % a 1 año."
    - horizon: 5
      name: "RNN con el movimiento de los futuros tras la valoración del spot (ronda 5)"
      test: "+0,9 % (B +0,6 %)"
      development: "−0,2 % (B −0,2 %)"
      reason: "Antes de 2022 empataba con B. En el test la diferencia es de 1,3 céntimos por barril."
    - horizon: 63
      name: "Media de RNN, LSTM y GRU (ronda 5)"
      test: "+7,1 % (B +3,7 %)"
      development: "−1,5 % (B −1,6 %)"
      reason: "Mezcla tres arquitecturas y antes de 2022 empataba con B."
    - horizon: 63
      name: "GRU con las mismas variables"
      test: "+5,7 % (B +3,7 %)"
      development: "−1,2 % (B −1,6 %)"
      reason: "Es otra arquitectura. A 1 semana no mejora al ingenuo y a 1 año gana menos (+5,8 % frente a +9,1 %)."
    - horizon: 252
      name: "LSTM con la relación oro/crudo"
      test: "+10,0 % (B +9,1 %)"
      development: "+12,9 % (B +13,0 %)"
      reason: "Es otra arquitectura. A 1 semana no se aparta del ingenuo y a 3 meses gana menos (+3,2 % frente a +3,7 %)."
    - horizon: 252
      name: "RNN con 20 semillas en lugar de 5 (ronda 5)"
      test: "+11,1 % (B +9,1 %)"
      development: "+14,7 % (B +13,0 %)"
      reason: "En 2008-2013 quedaba 0,3 puntos por debajo de B, y la regla fijada antes de entrenar exigía no empeorar en ningún periodo. Su intervalo en el test es igual de ancho."
  alternatives_note: >-
    Ninguna gana a B a la vez en los tres plazos, en el test y en todos los periodos anteriores
    a 2022. Cambiar el modelo por una de ellas sería ajustarlo al periodo 2022-2026, que ya se
    usó para elegir B.
