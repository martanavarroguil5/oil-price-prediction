[project]
name = "oilcast"
version = "0.1.0"
description = "Educational machine learning case study on oil price prediction using RNN, LSTM, and GRU, including data collection and supporting resources."
authors = [
    {name = "Marta Navarro Guil",email = "mnavagui@myuax.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.1.0,<4.0.0)",
    "yfinance (>=1.8.0,<2.0.0)",
    "torch (>=2.15.0,<3.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "optuna (>=5.0.0,<6.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "typer (>=0.29.1,<0.30.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "xlrd (>=2.0.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[project.scripts]
oilcast = "oilcast.cli:app"

[tool.poetry]
packages = [{ include = "oilcast", from = "src" }]

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.5,<0.18.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "nbconvert (>=7.17.2,<8.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)"
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]
# Script original del profesor: se conserva intacto como referencia
extend-exclude = ["scripts/download_data.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Notebooks: varias órdenes de matplotlib por línea y `;` para ocultar salidas
"*.ipynb" = ["E501", "E702", "E703"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
