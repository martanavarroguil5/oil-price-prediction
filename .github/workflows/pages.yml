name: Web en GitHub Pages

# Publica la versión estática de la web (previsión, prueba histórica y validación). Antes
# descarga los datos más recientes y prevé con los pesos guardados, sin reentrenar; si una
# fuente falla, publica con la serie del repositorio. Se lanza cada día, al subir a main o a mano.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * *"  # todos los días a las 06:30 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OILCAST_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Poetry
        run: pipx install poetry
      - name: Instalar dependencias
        run: poetry install --no-interaction --only main
      - name: Generar la web estática
        run: poetry run python -m oilcast -c configs/default.yaml export-static --out site --refresh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
